backend:
  name: github
  repo: pspacearchitecture-max/P-Space
  branch: Test-cms

media_folder: "images/projects"
public_folder: "/images/projects"

collections:
  - name: "projects"
    label: "Dự án Công trình"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tên công trình", name: "title", widget: "string" }
      - { label: "Địa điểm", name: "location", widget: "string" }
      - { label: "Phong cách thiết kế", name: "style", widget: "string" }
      - { label: "Ảnh đại diện (Thumbnail)", name: "thumbnail", widget: "image" }
      - label: "Bộ sưu tập ảnh công trình"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Ảnh chi tiết", name: "image", widget: "image" }
      - { label: "Mô tả ngắn", name: "description", widget: "text" }
